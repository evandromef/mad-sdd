services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MAD_DB_NAME:?Defina MAD_DB_NAME no ambiente}
      POSTGRES_USER: ${MAD_DB_USERNAME:?Defina MAD_DB_USERNAME no ambiente}
      POSTGRES_PASSWORD: ${MAD_DB_PASSWORD:?Defina MAD_DB_PASSWORD no ambiente}
    ports:
      - "${MAD_DB_PORT:?Defina MAD_DB_PORT no ambiente}:5432"
    volumes:
      - mad-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mad-postgres-data:
