<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="MAD início">
      <span class="brand-mark">M</span>
      <span class="brand-copy">
        <strong>MAD</strong>
        <small>Meus Ativos Digitais</small>
      </span>
    </a>

    <nav class="navigation" aria-label="Navegação principal">
      @for (item of navigationItems; track item) {
        <button type="button" class="navigation-item" [class.navigation-item-active]="item === 'Dashboard'">
          {{ item }}
        </button>
      }
    </nav>
  </aside>

  <div class="workspace">
    <header class="topbar">
      <div>
        <p class="eyebrow">Carteira selecionada</p>
        <strong>Carteira Principal</strong>
      </div>

      <button pButton type="button" label="Nova operação" icon="pi pi-plus"></button>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
